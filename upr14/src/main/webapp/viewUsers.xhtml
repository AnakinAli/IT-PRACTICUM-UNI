<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Потребители</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <main class="wide-card">
        <h1>Регистрирани потребители</h1>
        <h:dataTable value="#{user.users}" var="u" rowIndexVar="index"
                     styleClass="users-table" headerClass="table-header"
                     rowClasses="odd,even" rendered="#{not empty user.users}">
            <h:column>
                <f:facet name="header">Снимка</f:facet>
                <img src="#{user.userPhotos.get(index)}" alt="Профилна снимка" width="100" height="100"/>
            </h:column>
            <h:column>
                <f:facet name="header">Потребителско име</f:facet>
                <h:link outcome="profile" value="#{u.username}">
                    <f:param name="id" value="#{u.id}"/>
                </h:link>
            </h:column>
            <h:column>
                <f:facet name="header">Парола (учебна демонстрация)</f:facet>
                <h:outputText value="#{u.password}"/>
            </h:column>
        </h:dataTable>
        <h:panelGroup rendered="#{empty user.users}">
            <p>Все още няма регистрирани потребители.</p>
        </h:panelGroup>
        <p><h:link outcome="registration" value="Нова регистрация"/></p>
    </main>
</h:body>
</html>
